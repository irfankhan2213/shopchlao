version: "3"
services:
  partner-portal-development:
    image: partner-portal-development-image
    container_name: partner-portal-development
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    ports:
      - ${EXPOSE_PORT:-3000}:3000
    env_file:
      - ./.env.local
    command: yarn dev
    restart: "always"
    volumes:
      - ./:/app
      - ./node_modules:/app/node_modules